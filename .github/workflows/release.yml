name: release

# The release of the image.
#
# The workflow runs on a tag: it checks that the tag names the version of
# the package, it builds the image of the release **once**, it publishes
# it, it proves that the published bytes are the bytes that answer, it
# runs the gateway of the reference against them, and it exports the
# image as an artifact of the run.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The image is published with two tags: the tag of the release (`v0.2.0`)
# and the version itself (`0.2.0`). A deployment that pins a version pins
# the image of that release, and the digest of the image is what it pins.
#
# **The image is built once.** The build is published, and every gate of
# the release — the probes, the decisions, the refusals, the drain, the
# scan and the compatibility suite — runs against the **digest** of that
# build, never against a tag and never against a second build. The image
# that was tested is the image that runs: the digest that the gates
# proved is the digest that the deployment pins.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # The image is published to the registry of the repository, and it is
  # withdrawn from it when a gate of the release fails.
  packages: write

env:
  # The version of the runtime the service is built and released with.
  BUN_VERSION: '1.4.3'

jobs:
  build:
    name: the image of the release is built and published
    runs-on: ubuntu-latest
    outputs:
      # The digest of the published image: every other job of the release
      # runs against it.
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The outputs of this step are the tag and the version of the
      # release. They are written by the **same** step: an output that is
      # written by another step of the job is not readable here, the
      # expression is empty, and the build of the image fails with an
      # empty tag.
      - name: the version of the release
        id: version
        run: |
          expected=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$expected" ]; then
            echo "the tag $GITHUB_REF_NAME does not name the version $expected of the package"
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=$expected" >> "$GITHUB_OUTPUT"

      - name: the version of the release is known
        run: |
          if [ -z "${{ steps.version.outputs.tag }}" ] || [ -z "${{ steps.version.outputs.version }}" ]; then
            echo "the version of the release is empty: the step that computes it did not write its outputs"
            exit 1
          fi
          echo "the release is ${{ steps.version.outputs.tag }} (${{ steps.version.outputs.version }})"

      - name: the versions of the project agree
        run: bun run versions

      - uses: docker/setup-buildx-action@v3

      - name: the login in the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The one build of the release. It is published with its provenance
      # and its SBOM: the registry carries the attestations, and the
      # digest of what it carries is the digest of the release.
      - name: build and publish the image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/ggpwnkthx/hub:${{ steps.version.outputs.tag }}
            ghcr.io/ggpwnkthx/hub:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: true
          sbom: true

      - name: the digest of the image is known
        run: |
          # Every gate of the release runs against the digest, and the
          # digest is what a deployment pins: a gate that ran against
          # something else proves nothing about what is deployed.
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "the build did not write its digest: the release cannot be proven"
            exit 1
          fi
          echo "the image of the release is ghcr.io/ggpwnkthx/hub@${digest}"

  image:
    name: the published image is proven
    needs: build
    runs-on: ubuntu-latest
    services:
      # A deployment talks to a PostgreSQL server: the image applies the
      # migrations of the schema before it accepts a request.
      postgres:
        image: postgres:18-alpine
        ports:
          - '5432:5432'
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        options: >-
          --health-cmd "pg_isready -U hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The deployment of a production needs the store of the codes of the
      # logins: the image connects to it at the start and refuses to start
      # when it does not answer.
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # The image of the release, by its digest: never by its tag.
      IMAGE: ghcr.io/ggpwnkthx/hub@${{ needs.build.outputs.digest }}
    steps:
      - name: the image of the release is pulled by its digest
        run: |
          docker pull "$IMAGE"
          # The digest of the registry is read from the registry itself:
          # the image that the gates of the release run against is the
          # image that the deployment will pin.
          actual="$(docker buildx imagetools inspect "$IMAGE" | awk '/^Digest:/ { print $2 }')"
          echo "the image of the release is ${actual}"
          if [ -z "$actual" ] || [ "ghcr.io/ggpwnkthx/hub@${actual}" != "$IMAGE" ]; then
            echo "the image that was pulled is $actual and the release is $IMAGE"
            exit 1
          fi

      - name: the role of the deployment
        run: |
          # A production deployment refuses a role that bypasses the
          # isolation of the tenants (spec §3.9). The role of the image is
          # a role of its own, exactly as a deployment does it: it owns
          # the tables of the platform and it is not a superuser.
          # The `-i` is what gives the statements of the heredoc to psql:
          # without it, the container reads nothing and the step is green
          # with nothing done.
          docker run -i --rm --network host postgres:18-alpine \
            psql "postgres://hub:hub@localhost:5432/hub" -v ON_ERROR_STOP=1 <<'SQL'
          create role hub_app login password 'hub_app';
          grant usage, create on schema public to hub_app;
          SQL

      - name: the key of the identity signature
        run: |
          # The private key that signs the tokens of Hub. It comes from
          # the secret manager of the deployment and never from the
          # image: a key that is generated at the start of a process
          # invalidates every token that is alive.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$RUNNER_TEMP/hub-key.pem" 2>/dev/null
          {
            echo "HUB_SIGNING_KEY<<EOF"
            cat "$RUNNER_TEMP/hub-key.pem"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: the image starts with the configuration of a deployment
        run: |
          # The state of the deployment is shared: the image reaches the
          # PostgreSQL server and the Redis of the job through the host of
          # the runner.
          docker run -d --name hub -p 8081:8081 \
            --add-host host.docker.internal:host-gateway \
            -e HUB_DATABASE_URL=postgres://hub_app:hub_app@host.docker.internal:5432/hub \
            -e HUB_REDIS_URL=redis://host.docker.internal:6379/0 \
            -e HUB_ISSUER=https://hub.example.com \
            -e HUB_ADMIN_TOKEN=release-admin-token \
            -e HUB_ACCESS_TOKEN=release-access-token \
            -e HUB_STATE_SECRET="$(printf '4f9a2c8e%.0s' {1..8})" \
            -e HUB_SECRET_ENCRYPTION_KEY="$(printf 'b31e7d09%.0s' {1..8})" \
            -e HUB_SIGNING_KEY \
            -e HUB_SIGNING_KID=hub-release \
            "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/healthz > /dev/null; then
              echo "the service is healthy"
              curl -fsS http://127.0.0.1:8081/healthz
              echo
              break
            fi
            sleep 1
          done
          # The logs of the container are always printed: a failure that
          # does not say why is a failure that costs an afternoon.
          docker logs hub || true
          if ! curl -fsS http://127.0.0.1:8081/healthz > /dev/null; then
            echo "the service does not answer the probe of the health"
            exit 1
          fi
          # The database answers and the migrations are applied: the
          # service is ready.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/readyz > /dev/null; then
              echo "the service is ready"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8081/readyz > /dev/null; then
            echo "the service does not answer the probe of the readiness"
            docker logs hub || true
            exit 1
          fi

      - name: the image answers the decision of a gateway
        run: |
          set -euo pipefail
          # The service is a broker: it answers the decisions of a
          # gateway over the table of the grants. A tenant, a principal
          # and a decision: the image of the release serves the contract
          # that the gateway of the reference speaks.
          #
          # The answer is printed, and the logs of the service are printed
          # with it: a failure that does not say why is a failure that
          # costs an afternoon.
          tenant="$(curl -sS -X POST http://127.0.0.1:8081/v1/admin/tenants \
            -H 'authorization: Bearer release-admin-token' \
            -H 'content-type: application/json' \
            -d '{"slug":"acme","displayName":"Acme Inc","issuer":"https://login.acme.example","idpClientId":"hub-acme","idpClientSecret":"the-secret-of-the-provider","clientId":"shuttle-acme","clientSecret":"the-secret-of-the-gateway"}')"
          echo "the tenant: ${tenant}"
          principal="$(curl -sS -X POST http://127.0.0.1:8081/v1/admin/users \
            -H 'authorization: Bearer release-admin-token' \
            -H 'content-type: application/json' \
            -d '{"tenant":"acme","externalSubject":"00u1a2b3c4d5","email":"alice@acme.example"}' \
            | jq -r '.id')"
          echo "the principal: ${principal}"
          answer="$(curl -sS -X POST http://127.0.0.1:8081/v1/decisions \
            -H 'authorization: Bearer release-access-token' \
            -H 'content-type: application/json' \
            -d "{\"subject\":\"${principal}\",\"workspaceId\":\"\",\"routeId\":\"\",\"roles\":[]}")"
          echo "the decision of the gateway: ${answer}"
          # The logs of the service are always printed: they are the
          # reason of a refusal that the answer does not carry.
          docker logs hub || true
          if ! echo "${tenant}" | jq -e '.id' > /dev/null; then
            echo "the service did not create the tenant"
            exit 1
          fi
          # The identifier of the principal is a uuid, and not a json
          # object: the answer of the creation is read by `jq`.
          if ! printf '%s' "${principal}" |
            grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "the service did not create the principal"
            exit 1
          fi
          if ! echo "${answer}" | jq -e '.allow == false' > /dev/null; then
            echo "the service did not deny the decision of a principal without a grant"
            exit 1
          fi

      - name: the image refuses to start with an empty environment
        run: |
          # The environment of a production deployment is the one of the
          # image: the service has to refuse to start and to name the
          # secrets it misses.
          if docker run --rm "$IMAGE"; then
            echo "the service started with an empty environment"
            exit 1
          fi

      - name: the image refuses to start without a secret
        run: |
          if docker run --rm \
            -e HUB_DATABASE_URL=postgres://hub_app:hub_app@host.docker.internal:5432/hub \
            -e HUB_REDIS_URL=redis://host.docker.internal:6379/0 \
            "$IMAGE"; then
            echo "the service started without a secret"
            exit 1
          fi

      - name: the image refuses to start with a role that bypasses the isolation
        run: |
          # The bootstrap superuser is not subject to the policies of the
          # tables: the service has to refuse to start and to name the
          # role.
          set +e
          output="$(docker run --rm --add-host host.docker.internal:host-gateway \
            -e HUB_DATABASE_URL=postgres://hub:hub@host.docker.internal:5432/hub \
            -e HUB_REDIS_URL=redis://host.docker.internal:6379/0 \
            -e HUB_ISSUER=https://hub.example.com \
            -e HUB_ADMIN_TOKEN=release-admin-token \
            -e HUB_ACCESS_TOKEN=release-access-token \
            -e HUB_STATE_SECRET="$(printf '4f9a2c8e%.0s' {1..8})" \
            -e HUB_SECRET_ENCRYPTION_KEY="$(printf 'b31e7d09%.0s' {1..8})" \
            -e HUB_SIGNING_KEY \
            -e HUB_SIGNING_KID=hub-release \
            "$IMAGE" 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "the service started with a role that bypasses the isolation"
            exit 1
          fi
          if ! echo "$output" | grep -q "bypasses the isolation of the tenants"; then
            echo "the service did not name the reason of the refusal"
            exit 1
          fi

      - name: a signal drains the service and the service exits
        run: |
          start="$(date +%s)"
          docker stop --time 10 hub
          elapsed="$(( $(date +%s) - start ))"
          if [ "$elapsed" -gt 10 ]; then
            echo "the service took $elapsed seconds to stop"
            exit 1
          fi
          docker logs hub

      - name: the scan of the image
        run: |
          # A finding of a severity above high fails the release. The scan
          # reads the image of the release: the one that is published.
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --exit-code 1 --no-progress "$IMAGE"

      - name: export the image
        run: |
          # The exported image is the published one: a deployment that
          # unpacks the artifact runs the image of the release, digest
          # for digest, with its attestations.
          docker pull "$IMAGE"
          docker save "$IMAGE" | gzip > "hub-${{ needs.build.outputs.tag }}.tar.gz"
          # The digest of the image: it is what a deployment pins.
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}'

      - uses: actions/upload-artifact@v4
        with:
          name: hub-image-${{ needs.build.outputs.tag }}
          path: hub-${{ needs.build.outputs.tag }}.tar.gz
          retention-days: 30

  compatibility:
    name: the gateway of the reference, unchanged, against the image of the release
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        ports:
          - '5432:5432'
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        options: >-
          --health-cmd "pg_isready -U hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      IMAGE: ghcr.io/ggpwnkthx/hub@${{ needs.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install
        run: bun install --frozen-lockfile

      - name: the image of the release is pulled by its digest
        run: docker pull "$IMAGE"

      - name: the role of the deployment
        run: |
          docker run -i --rm --network host postgres:18-alpine \
            psql "postgres://hub:hub@localhost:5432/hub" -v ON_ERROR_STOP=1 <<'SQL'
          create role hub_app login password 'hub_app';
          grant usage, create on schema public to hub_app;
          SQL

      - name: the key of the identity signature
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$RUNNER_TEMP/hub-key.pem" 2>/dev/null
          {
            echo "HUB_SIGNING_KEY<<EOF"
            cat "$RUNNER_TEMP/hub-key.pem"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: the image of the release starts
        run: |
          # The image listens in the network of the runner: the gateway
          # of the reference and the browser of the test reach it at
          # 127.0.0.1, and it reaches the provider of the test — which
          # runs in the process of the test — at the same address.
          #
          # The environment is the one of a **development**: the provider
          # of the test is on the loopback, and a production deployment
          # refuses to call a private address (spec §6.6). The rules of a
          # production are proven by the job of the image, not by this
          # one: this job proves the protocol of the published bytes.
          docker run -d --name hub --network host \
            -e HUB_ENVIRONMENT=development \
            -e HUB_HOST=127.0.0.1 \
            -e HUB_PORT=8081 \
            -e HUB_ISSUER=http://127.0.0.1:8081 \
            -e HUB_PUBLIC_URL=http://127.0.0.1:8081 \
            -e HUB_DATABASE_URL=postgres://hub_app:hub_app@127.0.0.1:5432/hub \
            -e HUB_REDIS_URL=redis://127.0.0.1:6379/0 \
            -e HUB_ADMIN_TOKEN=release-admin-token \
            -e HUB_ACCESS_TOKEN=release-access-token \
            -e HUB_STATE_SECRET="$(printf '4f9a2c8e%.0s' {1..8})" \
            -e HUB_SECRET_ENCRYPTION_KEY="$(printf 'b31e7d09%.0s' {1..8})" \
            -e HUB_SIGNING_KEY \
            -e HUB_SIGNING_KID=hub-release \
            "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/healthz > /dev/null; then
              echo "the image of the release is healthy"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8081/healthz > /dev/null; then
            echo "the image of the release does not answer the probe of the health"
            docker logs hub || true
            exit 1
          fi
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/readyz > /dev/null; then
              echo "the image of the release is ready"
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8081/readyz > /dev/null; then
            echo "the image of the release does not answer the probe of the readiness"
            docker logs hub || true
            exit 1
          fi

      - name: the compatibility suite
        # The suite runs against the **image of the release**: the Hub of
        # the environment is the published image, and the suite never
        # creates one of its own when the environment names one.
        run: bun run test:compat
        env:
          HUB_EXTERNAL_URL: http://127.0.0.1:8081
          HUB_EXTERNAL_ADMIN_TOKEN: release-admin-token
          HUB_EXTERNAL_ACCESS_TOKEN: release-access-token
          # The checkout is kept: the step below reads its state.
          COMPAT_KEEP: '1'
          COMPAT_WORKSPACE: ${{ runner.temp }}/compatibility

      - name: the reference was not modified
        run: |
          # The gateway is read-only: a change in the tree of the
          # reference fails the release.
          checkout="${{ runner.temp }}/compatibility/shuttle"
          expected="$(bun -e 'const manifest = await Bun.file("compatibility.json").json(); console.log(manifest.repositories.shuttle.commit)')"
          head="$(git -C "$checkout" rev-parse HEAD)"
          if [ "$head" != "$expected" ]; then
            echo "the reference is at $head and the pin is $expected"
            exit 1
          fi
          if [ -n "$(git -C "$checkout" status --porcelain --untracked-files=no)" ]; then
            echo "the tree of the reference was modified"
            git -C "$checkout" status --porcelain
            exit 1
          fi
          echo "the tree of the reference is the one of $expected"

      - name: the logs of the image
        if: always()
        run: docker logs hub || true

  withdraw:
    name: the image of a failed release is withdrawn
    # The image is published before the gates run, so that the gates can
    # run against the bytes that ship. A release whose gates failed does
    # not ship: the image is withdrawn from the registry, and the tag of
    # the release points at nothing.
    needs: [build, image, compatibility]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: the login in the registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: the image is withdrawn
        run: |
          digest="${{ needs.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "the build of the release did not publish anything: there is nothing to withdraw"
            exit 0
          fi
          if docker buildx imagetools rm "ghcr.io/ggpwnkthx/hub@${digest}"; then
            echo "the image $digest is withdrawn from the registry"
          else
            echo "the image $digest could not be withdrawn: it must be removed by hand"
          fi
