name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The version of the runtime the service is built and released with.
  BUN_VERSION: '1.4.3'

jobs:
  check:
    name: types, lint, format and tests
    runs-on: ubuntu-latest
    services:
      # The integration tests run on the embedded PostgreSQL by default and
      # on a real server here: the engine of a deployment is the one of the
      # tests.
      postgres:
        image: postgres:17-alpine
        ports:
          - '5432:5432'
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        options: >-
          --health-cmd "pg_isready -U hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install
        run: bun install --frozen-lockfile

      - name: types
        run: bun run typecheck

      - name: lint
        run: bun run lint

      - name: format
        run: bun run format:check

      - name: import boundaries
        run: |
          bun run architecture
          bun test test/architecture

      - name: unit and contract tests
        run: bun test src test/contract

      - name: integration tests
        run: bun test test/integration

      - name: the integration tests against a PostgreSQL server
        run: bun test test/integration
        env:
          HUB_TEST_DATABASE_URL: postgres://hub:hub@localhost:5432/hub

  compatibility:
    name: the gateway of the reference, unchanged, against Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install
        run: bun install --frozen-lockfile

      - name: the reference of the gateway
        run: |
          git clone https://github.com/ggpwnkthx/shuttle.git ../shuttle
          git -C ../shuttle checkout $(cat shuttle.ref)
          cd ../shuttle
          bun install --frozen-lockfile

      - name: the compatibility suite
        run: bun test test/compatibility

      - name: the reference was not modified
        run: |
          # The gateway is read-only: a change in the tree of the reference
          # fails the build.
          if [ -n "$(git -C ../shuttle status --porcelain)" ]; then
            echo "the tree of the reference was modified"
            git -C ../shuttle status --porcelain
            exit 1
          fi
          echo "the tree of the reference is the one of $(cat shuttle.ref)"

  image:
    name: the production image
    runs-on: ubuntu-latest
    services:
      # A deployment talks to a PostgreSQL server: the image applies the
      # migrations of the schema before it accepts a request.
      postgres:
        image: postgres:17-alpine
        ports:
          - '5432:5432'
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        options: >-
          --health-cmd "pg_isready -U hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The deployment of a production needs the store of the codes of the
      # logins: the image connects to it at the start and refuses to start
      # when it does not answer.
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: docker build -f Dockerfile -t hub:ci .

      - name: the scan of the image
        run: |
          # A finding of a severity above high fails the build.
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --exit-code 1 --no-progress hub:ci

      - name: the software bill of materials
        run: |
          # The deployment knows what it runs.
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/work" anchore/syft:latest \
            hub:ci -o spdx-json > hub.spdx.json
          ls -l hub.spdx.json

      - name: the image runs as a user that is not root
        run: |
          user="$(docker image inspect hub:ci --format '{{.Config.User}}')"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "the image runs as '$user'"
            exit 1
          fi

      - name: the image is under 200 MB
        run: |
          size="$(docker image inspect hub:ci --format '{{.Size}}')"
          echo "the image is $((size / 1000 / 1000)) MB"
          if [ "$size" -ge 209715200 ]; then
            echo "the image is $size bytes"
            exit 1
          fi

      - name: the image refuses to start with an empty environment
        run: |
          # The environment of a production deployment is the one of the
          # image: the service has to refuse to start and to name the
          # secrets it misses.
          if docker run --rm hub:ci; then
            echo "the service started with an empty environment"
            exit 1
          fi

      - name: the image refuses to start without a secret
        run: |
          if docker run --rm \
            -e HUB_DATABASE_URL=postgres://hub:hub@host.docker.internal:5432/hub \
            -e HUB_REDIS_URL=redis://redis:6379/0 \
            hub:ci; then
            echo "the service started without a secret"
            exit 1
          fi

      - name: the role of the deployment is not a superuser
        run: |
          # A production deployment refuses a role that bypasses the
          # isolation of the tenants (spec §3.9). The role of the image is
          # a role of its own, exactly as a deployment does it: it owns
          # the tables of the platform and it is not a superuser. The
          # bootstrap superuser of the image cannot be demoted, and it does
          # not have to be: it is the role of the administration of the
          # database, not the role of the service.
          docker run --rm --network host postgres:17-alpine \
            psql "postgres://hub:hub@localhost:5432/hub" -v ON_ERROR_STOP=1 <<'SQL'
          create role hub_app login password 'hub_app';
          grant usage, create on schema public to hub_app;
          SQL

      - name: the image starts and answers the probes
        run: |
          # The signing key of the deployment: a key that is generated at the
          # start of a process invalidates every token that is alive, so it
          # comes from the environment.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/hub-key.pem 2>/dev/null
          docker run -d --name hub -p 8081:8081 \
            --add-host host.docker.internal:host-gateway \
            -e HUB_DATABASE_URL=postgres://hub_app:hub_app@host.docker.internal:5432/hub \
            -e HUB_REDIS_URL=redis://host.docker.internal:6379/0 \
            -e HUB_ISSUER=https://hub.example.com \
            -e HUB_ADMIN_TOKEN=ci-admin-token \
            -e HUB_ACCESS_TOKEN=ci-access-token \
            -e HUB_STATE_SECRET="$(printf 'a%.0s' {1..64})" \
            -e HUB_SECRET_ENCRYPTION_KEY="$(printf 'b%.0s' {1..64})" \
            -e HUB_SIGNING_KEY="$(cat /tmp/hub-key.pem)" \
            -e HUB_SIGNING_KID=hub-ci \
            hub:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/healthz > /dev/null; then
              echo "the service is healthy"
              break
            fi
            sleep 1
          done
          # The logs of the container are always printed: a failure that
          # does not say why is a failure that costs an afternoon.
          docker logs hub || true
          if ! curl -fsS http://127.0.0.1:8081/healthz; then
            echo "the service does not answer the probe of the health"
            exit 1
          fi
          # The database answers and the migrations are applied: the
          # service is ready.
          status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/readyz)"
          if [ "$status" != "200" ]; then
            echo "the readiness answered $status"
            exit 1
          fi

      - name: the image refuses to start with a role that bypasses the isolation
        run: |
          # The bootstrap superuser is not subject to the policies of the
          # tables: the service has to refuse to start and to name the
          # role.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/hub-key.pem 2>/dev/null
          set +e
          output="$(docker run --rm --add-host host.docker.internal:host-gateway \
            -e HUB_DATABASE_URL=postgres://hub:hub@host.docker.internal:5432/hub \
            -e HUB_REDIS_URL=redis://host.docker.internal:6379/0 \
            -e HUB_ISSUER=https://hub.example.com \
            -e HUB_ADMIN_TOKEN=ci-admin-token \
            -e HUB_ACCESS_TOKEN=ci-access-token \
            -e HUB_STATE_SECRET="$(printf 'a%.0s' {1..64})" \
            -e HUB_SECRET_ENCRYPTION_KEY="$(printf 'b%.0s' {1..64})" \
            -e HUB_SIGNING_KEY="$(cat /tmp/hub-key.pem)" \
            -e HUB_SIGNING_KID=hub-ci \
            hub:ci 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "the service started with a role that bypasses the isolation"
            exit 1
          fi
          if ! echo "$output" | grep -q "bypasses the isolation of the tenants"; then
            echo "the service did not name the reason of the refusal"
            exit 1
          fi

      - name: a signal drains the service and the service exits
        run: |
          start="$(date +%s)"
          docker stop --time 10 hub
          elapsed="$(( $(date +%s) - start ))"
          if [ "$elapsed" -gt 10 ]; then
            echo "the service took $elapsed seconds to stop"
            exit 1
          fi
          docker logs hub
